name: Sheduled


on:
    schedule:
      - cron: "0 6 * * *" 
    workflow_dispatch:
      inputs:
        suite:
          description: "Набор тестов"
          type: choice
          options: [all, smoke]
          default: all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      
      - name: Smoke
        if: github.event.inputs.suite == 'smoke'
        run: pytest app/tests -v -k test_add

      - name: All
        if: github.event_name == 'schedule' || github.event.inputs.suite == 'all'
        run: pytest app/tests -v
    
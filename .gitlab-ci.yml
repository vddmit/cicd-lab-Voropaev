stages:
  - test
  - build
  - deploy

variables:
  APP_DIR: "app"
  PYTHONPATH: "app"
  DOCKER_TLS_CERTDIR: "/certs"

# =========================
# TEST
# =========================

test:
  stage: test
  image: python:3.12-slim

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r $APP_DIR/requirements.txt pytest

  script:
    - python -m pytest $APP_DIR/tests -v --junitxml=report.xml

  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml

# =========================
# TEST MATRIX
# =========================

test-matrix:
  stage: test
  image: python:${PYTHON_VERSION}

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r $APP_DIR/requirements.txt pytest

  script:
    - python -m pytest $APP_DIR/tests -v

# =========================
# BUILD DOCKER
# =========================

build-docker:
  stage: build
  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - docker build -f $APP_DIR/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" $APP_DIR
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =========================
# DEPLOY
# =========================

deploy:
  stage: deploy
  image: alpine:latest

  environment:
    name: production
    url: https://your-production-domain.com

  script:
    - echo "Deploy image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - echo "Deployment to production is not configured yet."

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual